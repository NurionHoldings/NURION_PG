name: CI

on:
  pull_request:
  push:
    branches:
      - "feat/**"
      - "fix/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governed-bootstrap:
    name: ARKAON governed synthetic bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile source
        run: python -m compileall -q src scripts tests
      - name: Unit and policy tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Validate governance manifests
        run: PYTHONPATH=src python scripts/validate_governance.py
      - name: Generate deterministic bootstrap evidence
        run: PYTHONPATH=src python scripts/run_bootstrap_evidence.py
      - name: Verify clean source formatting
        run: git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: arkaon-bootstrap-evidence
          path: |
            build/arkaon-bootstrap-evidence.json
            build/arkaon-bootstrap-evidence.json.sha256
          if-no-files-found: error
          retention-days: 14

