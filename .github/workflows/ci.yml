            build/synthetic-webhook-intake-evidence.json
            build/synthetic-webhook-intake-evidence.json.sha256
            build/synthetic-durable-webhook-inbox-evidence.json
            build/synthetic-durable-webhook-inbox-evidence.json.sha256
            build/synthetic-webhook-command-proposal-evidence.json
            build/synthetic-webhook-command-proposal-evidence.json.sha256
            build/synthetic-proposal-review-docket-evidence.json
            build/synthetic-proposal-review-docket-evidence.json.sha256
