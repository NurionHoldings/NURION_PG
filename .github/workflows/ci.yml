      - name: Verify durable synthetic patch draft shadow review docket
        run: PYTHONPATH=src python scripts/run_synthetic_patch_draft_shadow_review_docket_evidence.py
      - name: Verify non-authorizing patch draft promotion operator packet
        run: PYTHONPATH=src python scripts/run_patch_draft_promotion_operator_packet_evidence.py
      - name: Verify patch draft promotion operator intent
        run: PYTHONPATH=src python scripts/run_patch_draft_promotion_decision_intake_evidence.py
      - name: Verify durable patch draft promotion intent receipt ledger
