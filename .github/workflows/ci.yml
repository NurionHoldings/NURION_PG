name: CI

on:
  pull_request:
  push:
    branches:
      - "feat/**"
      - "fix/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governed-bootstrap:
    name: ARKAON governed synthetic bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Compile source
        run: python -m compileall -q src scripts tests
      - name: Unit and policy tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Validate governance manifests
        run: PYTHONPATH=src python scripts/validate_governance.py
      - name: Generate deterministic bootstrap evidence
        run: PYTHONPATH=src python scripts/run_bootstrap_evidence.py
      - name: Validate official regulatory evidence registry
        run: PYTHONPATH=src python scripts/run_regulatory_evidence.py
      - name: Verify synthetic ledger invariants
        run: PYTHONPATH=src python scripts/run_synthetic_ledger_evidence.py
      - name: Verify synthetic Payment Intent lifecycle
        run: PYTHONPATH=src python scripts/run_payment_lifecycle_evidence.py
      - name: Verify synthetic webhook intake and quarantine
        run: PYTHONPATH=src python scripts/run_webhook_intake_evidence.py
      - name: Verify synthetic durable webhook inbox
        run: PYTHONPATH=src python scripts/run_durable_webhook_inbox_evidence.py
      - name: Verify synthetic webhook command proposals
        run: PYTHONPATH=src python scripts/run_webhook_command_proposal_evidence.py
      - name: Verify synthetic proposal review docket
        run: PYTHONPATH=src python scripts/run_proposal_review_docket_evidence.py
      - name: Verify read-only synthetic reconciliation monitor
        run: PYTHONPATH=src python scripts/run_reconciliation_monitor_evidence.py
      - name: Verify durable synthetic reconciliation case docket
        run: PYTHONPATH=src python scripts/run_reconciliation_case_docket_evidence.py
      - name: Verify non-executable synthetic remediation proposals
        run: PYTHONPATH=src python scripts/run_reconciliation_remediation_proposal_evidence.py
      - name: Verify synthetic remediation review docket
        run: PYTHONPATH=src python scripts/run_remediation_review_docket_evidence.py
      - name: Verify remediation synthetic shadow evaluation
        run: PYTHONPATH=src python scripts/run_remediation_synthetic_shadow_evidence.py
      - name: Verify clean source formatting
        run: git diff --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arkaon-bootstrap-evidence
          path: |
            build/arkaon-bootstrap-evidence.json
            build/arkaon-bootstrap-evidence.json.sha256
            build/regulatory-evidence-report.json
            build/regulatory-evidence-report.json.sha256
            build/synthetic-ledger-evidence.json
            build/synthetic-ledger-evidence.json.sha256
            build/synthetic-payment-lifecycle-evidence.json
            build/synthetic-payment-lifecycle-evidence.json.sha256
            build/synthetic-webhook-intake-evidence.json
            build/synthetic-webhook-intake-evidence.json.sha256
            build/synthetic-durable-webhook-inbox-evidence.json
            build/synthetic-durable-webhook-inbox-evidence.json.sha256
            build/synthetic-webhook-command-proposal-evidence.json
            build/synthetic-webhook-command-proposal-evidence.json.sha256
            build/synthetic-proposal-review-docket-evidence.json
            build/synthetic-proposal-review-docket-evidence.json.sha256
            build/synthetic-reconciliation-monitor-evidence.json
            build/synthetic-reconciliation-monitor-evidence.json.sha256
            build/synthetic-reconciliation-case-docket-evidence.json
            build/synthetic-reconciliation-case-docket-evidence.json.sha256
            build/synthetic-remediation-proposal-evidence.json
            build/synthetic-remediation-proposal-evidence.json.sha256
            build/synthetic-remediation-review-docket-evidence.json
            build/synthetic-remediation-review-docket-evidence.json.sha256
            build/synthetic-remediation-shadow-evidence.json
            build/synthetic-remediation-shadow-evidence.json.sha256
          if-no-files-found: error
          retention-days: 14
