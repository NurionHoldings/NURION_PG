name: CI

on:
  pull_request:
  push:
    branches:
      - "feat/**"
      - "fix/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-ephemeral-proof:
    name: PostgreSQL ephemeral repository proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.4-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: nurion_ci
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: nurion_pg_ci
        options: >-
          --health-cmd "pg_isready -U nurion_ci -d nurion_pg_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: nurion_pg_ci
      PGUSER: nurion_ci
      NURION_PG_EPHEMERAL_TEST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install test-only PostgreSQL driver
        run: python -m pip install "psycopg[binary]==3.2.10"
      - name: Prove isolated migration repository and concurrency
        run: PYTHONPATH=src python scripts/run_postgres_ephemeral_repository_integration.py
      - name: Prove bounded retry and commit-unknown recovery
        run: PYTHONPATH=src:. python scripts/run_postgres_retry_resilience_integration.py
      - name: Prove actual deadlock and lock timeout boundaries
        run: PYTHONPATH=src:. python scripts/run_postgres_deadlock_integration.py
      - name: Prove actual backend termination and reconciliation boundaries
        run: PYTHONPATH=src:. python scripts/run_postgres_connection_loss_integration.py
      - name: Prove append-only recovery quarantine boundaries
        run: PYTHONPATH=src:. python scripts/run_postgres_recovery_quarantine_integration.py
      - name: Prove append-only recovery disposition boundaries
        run: PYTHONPATH=src:. python scripts/run_postgres_recovery_disposition_integration.py
      - name: Prove append-only recovery supersession lineage
        run: PYTHONPATH=src:. python scripts/run_postgres_recovery_supersession_integration.py
      - name: Prove exact current-head recovery review receipt
        run: PYTHONPATH=src:. python scripts/run_postgres_recovery_review_receipt_integration.py
      - name: Prove recovery recommendation and independent concurrence
        run: PYTHONPATH=src:. python scripts/run_postgres_recovery_recommendation_concurrence_integration.py
      - name: Prove append-only recovery conflict resolution lineage
        run: PYTHONPATH=src:. python scripts/run_postgres_recovery_conflict_resolution_integration.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-ephemeral-repository-proof
          path: |
            build/postgres-ephemeral-repository-integration-evidence.json
            build/postgres-ephemeral-repository-integration-evidence.json.sha256
            build/postgres-retry-resilience-integration-evidence.json
            build/postgres-retry-resilience-integration-evidence.json.sha256
            build/postgres-deadlock-integration-evidence.json
            build/postgres-deadlock-integration-evidence.json.sha256
            build/postgres-connection-loss-integration-evidence.json
            build/postgres-connection-loss-integration-evidence.json.sha256
            build/postgres-recovery-quarantine-integration-evidence.json
            build/postgres-recovery-quarantine-integration-evidence.json.sha256
            build/postgres-recovery-disposition-integration-evidence.json
            build/postgres-recovery-disposition-integration-evidence.json.sha256
            build/postgres-recovery-supersession-integration-evidence.json
            build/postgres-recovery-supersession-integration-evidence.json.sha256
            build/postgres-recovery-review-receipt-integration-evidence.json
            build/postgres-recovery-review-receipt-integration-evidence.json.sha256
            build/postgres-recovery-recommendation-concurrence-integration-evidence.json
            build/postgres-recovery-recommendation-concurrence-integration-evidence.json.sha256
            build/postgres-recovery-conflict-resolution-integration-evidence.json
            build/postgres-recovery-conflict-resolution-integration-evidence.json.sha256
          if-no-files-found: error
          retention-days: 14

