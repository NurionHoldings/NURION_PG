      - name: Verify limited promotion activation operator intent
        run: PYTHONPATH=src python scripts/run_synthetic_patch_draft_limited_promotion_activation_intake_evidence.py
      - name: Verify durable limited promotion activation receipt ledger
        run: PYTHONPATH=src python scripts/run_synthetic_patch_draft_limited_promotion_activation_receipt_ledger_evidence.py
      - name: Verify metadata-only limited promotion activation draft
        run: PYTHONPATH=src python scripts/run_synthetic_patch_draft_limited_promotion_activation_draft_evidence.py
      - name: Verify independent activation draft review docket
        run: PYTHONPATH=src python scripts/run_synthetic_patch_draft_limited_promotion_activation_draft_review_evidence.py
      - name: Verify metadata-only activation dry-run design
        run: PYTHONPATH=src python scripts/run_synthetic_activation_dry_run_design_evidence.py
      - name: Verify independent activation dry-run design review
        run: PYTHONPATH=src python scripts/run_synthetic_activation_dry_run_design_review_evidence.py
      - name: Verify metadata-only activation dry-run fixture proposal
        run: PYTHONPATH=src python scripts/run_synthetic_activation_dry_run_fixture_proposal_evidence.py
      - name: Verify independent activation dry-run fixture proposal review
        run: PYTHONPATH=src python scripts/run_synthetic_activation_dry_run_fixture_proposal_review_evidence.py
      - name: Verify non-materialized activation dry-run fixture draft
        run: PYTHONPATH=src python scripts/run_synthetic_activation_dry_run_fixture_draft_evidence.py
      - name: Verify independent activation dry-run fixture draft review
        run: PYTHONPATH=src python scripts/run_synthetic_activation_dry_run_fixture_draft_review_evidence.py
      - name: Verify metadata-only activation dry-run fixture materialization plan
        run: PYTHONPATH=src python scripts/run_synthetic_activation_dry_run_fixture_materialization_plan_evidence.py
      - name: Verify independent activation dry-run fixture materialization plan review
        run: PYTHONPATH=src python scripts/run_synthetic_activation_dry_run_fixture_materialization_plan_review_evidence.py
      - name: Verify clean source formatting
        run: git diff --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arkaon-bootstrap-evidence
          path: |
            build/arkaon-bootstrap-evidence.json
            build/arkaon-bootstrap-evidence.json.sha256
            build/regulatory-evidence-report.json
