name: CI

on:
  pull_request:
  push:
    branches:
      - "feat/**"
      - "fix/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governed-bootstrap:
    name: ARKAON governed synthetic bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Compile source
        run: python -m compileall -q src scripts tests
      - name: Unit and policy tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Validate governance manifests
        run: PYTHONPATH=src python scripts/validate_governance.py
      - name: Generate deterministic bootstrap evidence
        run: PYTHONPATH=src python scripts/run_bootstrap_evidence.py
      - name: Validate official regulatory evidence registry
        run: PYTHONPATH=src python scripts/run_regulatory_evidence.py
      - name: Verify synthetic ledger invariants
        run: PYTHONPATH=src python scripts/run_synthetic_ledger_evidence.py
      - name: Verify synthetic Payment Intent lifecycle
        run: PYTHONPATH=src python scripts/run_payment_lifecycle_evidence.py
      - name: Verify synthetic webhook intake and quarantine
        run: PYTHONPATH=src python scripts/run_webhook_intake_evidence.py
      - name: Verify synthetic durable webhook inbox
        run: PYTHONPATH=src python scripts/run_durable_webhook_inbox_evidence.py
      - name: Verify synthetic webhook command proposals
        run: PYTHONPATH=src python scripts/run_webhook_command_proposal_evidence.py
      - name: Verify synthetic proposal review docket
        run: PYTHONPATH=src python scripts/run_proposal_review_docket_evidence.py
      - name: Verify read-only synthetic reconciliation monitor
        run: PYTHONPATH=src python scripts/run_reconciliation_monitor_evidence.py
      - name: Verify durable synthetic reconciliation case docket
        run: PYTHONPATH=src python scripts/run_reconciliation_case_docket_evidence.py
      - name: Verify non-executable synthetic remediation proposals
        run: PYTHONPATH=src python scripts/run_reconciliation_remediation_proposal_evidence.py
      - name: Verify synthetic remediation review docket
        run: PYTHONPATH=src python scripts/run_remediation_review_docket_evidence.py
      - name: Verify remediation synthetic shadow evaluation
        run: PYTHONPATH=src python scripts/run_remediation_synthetic_shadow_evidence.py
      - name: Verify synthetic shadow review docket
        run: PYTHONPATH=src python scripts/run_remediation_shadow_review_docket_evidence.py
      - name: Verify non-authorizing operator decision packets
        run: PYTHONPATH=src python scripts/run_operator_decision_packet_evidence.py
      - name: Verify synthetic operator decision intent intake
        run: PYTHONPATH=src python scripts/run_operator_decision_intake_evidence.py
      - name: Verify durable synthetic decision receipt ledger
        run: PYTHONPATH=src python scripts/run_operator_decision_receipt_ledger_evidence.py
      - name: Verify non-executable synthetic implementation proposal drafts
        run: PYTHONPATH=src python scripts/run_synthetic_implementation_proposal_evidence.py
      - name: Verify durable synthetic implementation proposal review docket
        run: PYTHONPATH=src python scripts/run_synthetic_implementation_review_evidence.py
      - name: Verify metadata-only synthetic patch shadow evaluation
