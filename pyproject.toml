[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nurion-pg"
version = "0.1.0.dev1"
description = "Synthetic-only governed bootstrap for NURION PG"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
]

[project.scripts]
nurion-pg-api = "nurion_pg.api.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
